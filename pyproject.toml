[project]
name = "cosyvoice-ray-serve-api"
version = "0.3.0"
description = "Ray Serve HTTP API for CosyVoice3 text-to-speech inference."
readme = "README.md"
requires-python = "==3.11.*"

dependencies = [
    # Serving layer
    "ray[serve]",
    "fastapi",
    "uvicorn",
    "pydantic>=2.9,<3",
    "python-multipart",
    # Inference core (Linux CUDA 13.2 wheels come from pytorch-cu132 below)
    "torch",
    "torchaudio",
    "torchcodec",
    "numpy>=2",
    "scipy",
    "librosa>=0.11.0",
    "soundfile",
    # Pinned to 4.51.3 to avoid Qwen2 autoregressive attention-mask regressions in
    # transformers >=4.53/5.x (FunAudioLLM/CosyVoice #1886, #1953) while keeping
    # vendored cosyvoice/ read-only.
    "transformers==4.51.3",
    "diffusers",
    "x-transformers",
    "matcha-tts",
    "hyperpyyaml",
    "omegaconf",
    "hydra-core",
    "conformer",
    "inflect",
    "wetext",
    "openai-whisper",
    "onnx",
    "modelscope",
    "onnxruntime-gpu; sys_platform == 'linux'",
    "onnxruntime; sys_platform != 'linux'",
    # Explicit direct imports used by vendored cosyvoice/
    "einops",
    "tiktoken",
    "tqdm",
    "packaging",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

# Trim matcha-tts 0.0.7.2 metadata to the modules imported at inference time by
# vendored cosyvoice/ so uv does not pull gradio 3.x, optuna, seaborn, or numpy<2.
[[tool.uv.dependency-metadata]]
name = "matcha-tts"
version = "0.0.7.2"
requires-dist = ["torch", "einops", "numpy", "lightning", "gdown", "matplotlib", "wget", "rich"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]
torchcodec = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "cosyvoice",
    "pretrained_models",
    "tmp",
    "logs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
